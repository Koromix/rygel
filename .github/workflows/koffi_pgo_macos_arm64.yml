name: Koffi PGO for macOS ARM64

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'

run-name: ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
      commit:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Homebrew Clang
        run: |
          brew install llvm

      - name: Build Koffi with PGO
        run: |
          export PATH=/opt/homebrew/opt/llvm/bin:$PATH
          src/koffi/tools/pgo_clang.sh

      - name: Inspect binary
        run: |
          file bin/Koffi/darwin_arm64/koffi.node
          lipo bin/Koffi/darwin_arm64/koffi.node -verify_arch arm64
          otool -L bin/Koffi/darwin_arm64/koffi.node
          xcrun vtool -show-build bin/Koffi/darwin_arm64/koffi.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koffi_pgo_darwin_arm64
          path: bin/Koffi/darwin_arm64/koffi.node
          if-no-files-found: error
          retention-days: 7
