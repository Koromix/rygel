<svg xmlns="http://www.w3.org/2000/svg" id="svg6945" preserveAspectRatio="xMidYMid meet" viewBox="0 0 814.783 534.224" zoomAndPan="magnify"><style>@import url(/static/site.min.css);</style><defs id="defs31"><clipPath id="47d6cf4432"><path id="path4" d="M67.14 144.125H219v76.41H67.14Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="538b4877b1"><path id="path7" d="M67.14 144.125H219.22v76.41H67.14Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="2fa08067bd"><path id="path10" d="M436.785 14.895h392.39v546.351h-392.39Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="41abba98f5"><path id="path13" d="M245 28.215h151.582v76.414H245Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="c32f4cece3"><path id="path16" d="M244.504 28.215h152.078v76.414H244.504Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="aec6b78ae3"><path id="path19" d="M67.14 28.215H219v76.414H67.14Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="d96e5939ae"><path id="path22" d="M67.14 28.215H219.22v76.414H67.14Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="23870d0342"><path id="path25" d="M245 143.188h151.582v76.414H245Zm0 0" clip-rule="nonzero"/></clipPath><clipPath id="55267153b0"><path id="path28" d="M244.504 143.188h152.078v76.414H244.504Zm0 0" clip-rule="nonzero"/></clipPath></defs><g id="g43" clip-path="url(#2fa08067bd)" transform="matrix(1 0 0 .97791 -14.299 -14.566)"><path id="path41" fill="#3c8ebb" fill-opacity="1" fill-rule="nonzero" d="M436.785 14.895h392.297v546.289H436.785Zm0 0"/></g><path id="path45" fill="#fff" fill-opacity="1" fill-rule="nonzero" d="M441.963 27.418a2.97 2.97 0 0 1-.875 2.117 2.98 2.98 0 0 1-2.121.88 2.98 2.98 0 0 1-2.117-.879 2.96 2.96 0 0 1-.88-2.118 2.97 2.97 0 0 1 .88-2.117 2.98 2.98 0 0 1 2.117-.88 2.97 2.97 0 0 1 2.121.88q.42.416.649.969.227.55.226 1.148m0 0"/><path id="path979" fill="#fff" fill-opacity="1" fill-rule="nonzero" d="M441.963 127.812q.001.594-.226 1.145a2.97 2.97 0 0 1-1.622 1.621 2.97 2.97 0 0 1-2.293 0 3 3 0 0 1-.972-.648 2.98 2.98 0 0 1-.88-2.118 2.97 2.97 0 0 1 .88-2.12 3 3 0 0 1 .972-.65 2.95 2.95 0 0 1 2.293 0 2.97 2.97 0 0 1 1.622 1.622q.227.55.226 1.148m0 0"/><path id="path1817" fill="#fff" fill-opacity="1" fill-rule="nonzero" d="M441.963 228.203q.001.597-.226 1.148a2.97 2.97 0 0 1-1.622 1.621q-.55.228-1.148.227c-.398 0-.777-.074-1.145-.227a3 3 0 0 1-.972-.648 2.98 2.98 0 0 1-.88-2.121 2.96 2.96 0 0 1 .88-2.117q.421-.424.972-.649a2.97 2.97 0 0 1 2.293 0q.552.225.973.649.42.42.649.972.227.552.226 1.145m0 0"/><path id="path3349" fill="#fff" fill-opacity="1" fill-rule="nonzero" d="M441.963 367.506q.001.6-.226 1.145a3 3 0 0 1-.649.972 2.98 2.98 0 0 1-2.121.88 2.98 2.98 0 0 1-2.117-.879 2.98 2.98 0 0 1-.88-2.118 2.97 2.97 0 0 1 .88-2.12q.421-.419.972-.65a2.95 2.95 0 0 1 1.145-.226q.597-.001 1.148.227.552.23.973.648.42.422.649.973.227.55.226 1.148m0 0"/><path id="path3673" fill="#fff" fill-opacity="1" fill-rule="nonzero" d="M441.963 428.944q.001.595-.226 1.144a3 3 0 0 1-.649.973 2.98 2.98 0 0 1-2.121.879 2.98 2.98 0 0 1-2.117-.879 2.98 2.98 0 0 1-.88-2.117 2.97 2.97 0 0 1 .88-2.121q.421-.419.972-.649a2.95 2.95 0 0 1 1.145-.226q.597-.001 1.148.226.552.23.973.649t.649.972q.227.55.226 1.149m0 0"/><text xml:space="preserve" id="text14321" x="895.719" y="56.267" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;white-space:pre;inline-size:353.824;fill:#fff;fill-opacity:1;stroke:none;stroke-width:.750946" transform="translate(-442.852 -23.896)"><tspan id="tspan69342" x="895.719" y="56.267"><tspan id="tspan69340" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">Posture inhibée</tspan> : génère du non-dit, </tspan><tspan id="tspan69344" x="895.719" y="76.292">l&apos;incapacité à dire non, à faire des demandes, à </tspan><tspan id="tspan69346" x="895.719" y="96.317">exprimer son avis, surtout s&apos;il est contraire à </tspan><tspan id="tspan69348" x="895.719" y="116.343">celui de son interlocuteur.
</tspan><tspan id="tspan69350" x="895.719" y="136.368">
</tspan><tspan id="tspan69354" x="895.719" y="156.393"><tspan id="tspan69352" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">Posture agressive</tspan> : les émotions sont </tspan><tspan id="tspan69356" x="895.719" y="176.418">extériorisées de façon excessive tant dans le </tspan><tspan id="tspan69358" x="895.719" y="196.444">non verbal que dans le contenu. Risque </tspan><tspan id="tspan69360" x="895.719" y="216.469">d&apos;entrer en conflit.
</tspan><tspan id="tspan69362" x="895.719" y="236.494">
</tspan><tspan id="tspan69366" x="895.719" y="256.519"><tspan id="tspan69364" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">Posture manipulatrice</tspan> : expression de ses </tspan><tspan id="tspan69368" x="895.719" y="276.545">émotions, de ses désirs et de ses opinions </tspan><tspan id="tspan69370" x="895.719" y="296.57">dans le but de défendre ses droits et de </tspan><tspan id="tspan69372" x="895.719" y="316.595">satisfaire ses besoins, mais de façon toujours </tspan><tspan id="tspan69374" x="895.719" y="336.62">indirecte et souvent malhonnête et ceci au </tspan><tspan id="tspan69376" x="895.719" y="356.646">détriment fréquent des droits des autres.
</tspan><tspan id="tspan69378" x="895.719" y="376.671">
</tspan><tspan id="tspan69384" x="895.719" y="396.696"><tspan id="tspan69380" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">Obectif : tendre vers la posture </tspan><tspan id="tspan69382" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">assertive </tspan></tspan><tspan id="tspan69388" x="895.719" y="416.721"><tspan id="tspan69386" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">(affirmée)</tspan>
</tspan><tspan id="tspan69390" x="895.719" y="436.747">
</tspan><tspan id="tspan69394" x="895.719" y="456.772"><tspan id="tspan69392" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">Posture assertive</tspan> : capacité d&apos;exprimer ses </tspan><tspan id="tspan69396" x="895.719" y="476.797">émotions, ses pensées et ses opinions, de </tspan><tspan id="tspan69398" x="895.719" y="496.822">défendre ses droits tout en respectant ceux </tspan><tspan id="tspan69400" x="895.719" y="516.848">des autres, de façon directe, honnête et </tspan><tspan id="tspan69402" x="895.719" y="536.873">appropriée.</tspan></text><text xml:space="preserve" id="text63485" x="1311.237" y="164.298" style="font-style:normal;font-weight:400;font-size:30.0378px;line-height:1.25;font-family:sans-serif;fill:#000;fill-opacity:1;stroke:none;stroke-width:.750946"/><g id="g65561" transform="translate(5.882 -10)"><g id="g35" clip-path="url(#47d6cf4432)" transform="translate(-46.424 -20.902)"><path id="path33" fill="#e78404" fill-opacity="1" fill-rule="evenodd" d="m68.07 144.328 131.371.399 19.387 36.98-19.387 38.574-131.765-.797 19.386-37.777Zm0 0"/></g><g id="g39" clip-path="url(#538b4877b1)" style="fill:#ec9d36;fill-opacity:1;stroke:none" transform="translate(-46.424 -20.902)"><path id="path37" fill="none" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" stroke-width="1.25" d="m53.704 164.347 371.453 1.12 54.817 104.05-54.817 108.535-372.569-2.242 54.817-106.292zm0 0" style="fill:#ec9d36;fill-opacity:1;stroke:none" transform="matrix(.35367 0 0 .35541 49.077 85.918)"/></g><g id="g4755" clip-path="url(#41abba98f5)" transform="translate(-59.94 -2.88)"><path id="path4753" fill="#e78404" fill-opacity="1" fill-rule="evenodd" d="m245.434 28.422 131.37.398 19.387 36.98-19.386 38.575-131.77-.797 19.39-37.777zm0 0"/></g><g id="g4759" clip-path="url(#c32f4cece3)" style="fill:#ec9d36;fill-opacity:1;stroke:none" transform="translate(-59.94 -2.88)"><path id="path4757" fill="none" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" stroke-width="1.25" d="m53.705 164.348 371.454 1.121 54.816 104.05-54.816 108.535-372.58-2.242 54.827-106.292zm0 0" style="fill:#ec9d36;fill-opacity:1;stroke:none" transform="matrix(.35367 0 0 .35541 226.44 -29.99)"/></g><g id="g4763" clip-path="url(#aec6b78ae3)" style="fill:#ec9d36;fill-opacity:1" transform="translate(-46.424 -2.88)"><path id="path4761" fill="#e78404" fill-opacity="1" fill-rule="evenodd" d="m68.07 28.422 131.371.398 19.387 36.98-19.387 38.575-131.765-.797 19.386-37.777Zm0 0" style="fill:#ec9d36;fill-opacity:1"/></g><g id="g4767" clip-path="url(#d96e5939ae)" style="stroke:none" transform="translate(-46.424 -2.88)"><path id="path4765" fill="none" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" stroke-width="1.25" d="m53.704 164.348 371.453 1.121 54.817 104.05-54.817 108.535-372.569-2.242 54.817-106.292zm0 0" style="stroke:none" transform="matrix(.35367 0 0 .35541 49.077 -29.99)"/></g><g id="g4969" clip-path="url(#23870d0342)" style="fill:#ec9d36;fill-opacity:1;stroke:none" transform="translate(-59.94 -20.902)"><path id="path4967" fill="#e78404" fill-opacity="1" fill-rule="evenodd" d="m245.434 143.395 131.37.398 19.387 36.98-19.386 38.57-131.77-.792 19.39-37.778zm0 0" style="fill:#ec9d36;fill-opacity:1;stroke:none"/></g><g id="g4973" clip-path="url(#55267153b0)" style="stroke:none" transform="translate(-59.94 -20.902)"><path id="path4971" fill="none" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-opacity="1" stroke-width="1.25" d="m53.705 164.353 371.454 1.12 54.816 104.051-54.816 108.523-372.58-2.23 54.827-106.293zm0 0" style="stroke:none" transform="matrix(.35367 0 0 .35541 226.44 84.982)"/></g><text xml:space="preserve" id="text119389" x="57.829" y="165.565" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946"><tspan id="tspan119387" x="57.829" y="165.565" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946">Assertivité</tspan></text><text xml:space="preserve" id="text120587" x="62.413" y="67.726" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946"><tspan id="tspan120585" x="62.413" y="67.726" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946">Inhibition</tspan></text><text xml:space="preserve" id="text122329" x="224.327" y="67.996" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946"><tspan id="tspan122327" x="224.327" y="67.996" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946">Agressivité</tspan></text><text xml:space="preserve" id="text123377" x="216.313" y="165.194" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946"><tspan id="tspan123375" x="216.313" y="165.194" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16.0202px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;fill:#fff;fill-opacity:1;stroke-width:.750946">Manipulation</tspan></text></g><text xml:space="preserve" id="text152135" x="184.594" y="243.9" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:20.0252px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;text-align:center;text-anchor:middle;fill:#3c8ebb;fill-opacity:1;stroke-width:.750946"><tspan id="tspan152133" x="184.594" y="243.9" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:20.0252px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;text-align:center;text-anchor:middle;fill:#3c8ebb;fill-opacity:1;stroke-width:.750946">La méthode OSBD :</tspan><tspan id="tspan219989" x="184.594" y="268.931" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:20.0252px;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;text-align:center;text-anchor:middle;fill:#3c8ebb;fill-opacity:1;stroke-width:.750946">exprimer une demande</tspan></text><g id="g65535" transform="translate(15.144 -10)"><text xml:space="preserve" id="text152655" x="-62.664" y="257.191" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16px;line-height:1.9;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;white-space:pre;inline-size:401.327;fill:#383838;fill-opacity:1;stroke-width:.750946" transform="translate(46.786 74.742)"><tspan id="tspan69406" x="-62.664" y="257.191"><tspan id="tspan69404" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;;fill:#3c8ebb">O - Observation :</tspan>
</tspan><tspan id="tspan69408" x="-62.664" y="287.591">
</tspan><tspan id="tspan69412" x="-62.664" y="317.991"><tspan id="tspan69410" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;;fill:#3c8ebb">S - Sentiment :</tspan>
</tspan><tspan id="tspan69414" x="-62.664" y="348.391">
</tspan><tspan id="tspan69418" x="-62.664" y="378.791"><tspan id="tspan69416" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;;fill:#3c8ebb">B - Besoin :</tspan>
</tspan><tspan id="tspan69420" x="-62.664" y="409.191">
</tspan><tspan id="tspan69424" x="-62.664" y="439.591"><tspan id="tspan69422" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;;fill:#3c8ebb">D - Demande :</tspan></tspan></text><text xml:space="preserve" id="text3565" x="-44.773" y="284.601" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;white-space:pre;inline-size:230.572;fill:#383838;fill-opacity:1;stroke:none" transform="translate(169.786 47.092)"><tspan id="tspan69426" x="-44.773" y="284.601">Constater les faits sans porter </tspan><tspan id="tspan69428" x="-44.773" y="304.601">de jugement sur la personne
</tspan><tspan id="tspan69430" x="-44.773" y="324.601">
</tspan><tspan id="tspan69432" x="-44.773" y="344.601">Identifier les émotions </tspan><tspan id="tspan69434" x="-44.773" y="364.601">ressenties et les exprimer
</tspan><tspan id="tspan69436" x="-44.773" y="384.601">
</tspan><tspan id="tspan69438" x="-44.773" y="404.601">Exprimer son besoin, en quoi </tspan><tspan id="tspan69440" x="-44.773" y="424.601">cela est important pour soi
</tspan><tspan id="tspan69442" x="-44.773" y="444.601">
</tspan><tspan id="tspan69444" x="-44.773" y="464.601">Clarifier ce qui est souhaité, de </tspan><tspan id="tspan69446" x="-44.773" y="484.601">façon concrète et réalisable</tspan></text></g></svg>