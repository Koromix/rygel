cation:&quot;Open Sans&quot;;white-space:pre;inline-size:386.587;fill:#383838;fill-opacity:1;stroke:none" transform="translate(-7.16 -.246)"><tspan id="tspan7535" x="132.184" y="468.345">Vise à remplacer les <tspan id="tspan7533" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">stratégies d&apos;évitement</tspan> </tspan><tspan id="tspan7537" x="132.184" y="490.011">par des stratégies plus bénéfiques, par </tspan><tspan id="tspan7545" x="132.184" y="511.678">l&apos;<tspan id="tspan7539" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">augmentation </tspan><tspan id="tspan7541" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">de la </tspan><tspan id="tspan7543" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">participation à des </tspan></tspan><tspan id="tspan7553" x="132.184" y="533.344"><tspan id="tspan7547" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">activités sociales et </tspan><tspan id="tspan7549" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">personnelles </tspan><tspan id="tspan7551" style="font-weight:700;-inkscape-font-specification:&quot;Open Sans Bold&quot;">plaisantes</tspan>.
</tspan><tspan id="tspan7555" x="132.184" y="555.011">
</tspan><tspan id="tspan7557" x="132.184" y="576.678">L&apos;augmentation des activités engendre des </tspan><tspan id="tspan7559" x="132.184" y="598.344">émotions positives ce qui permettrait de </tspan><tspan id="tspan7561" x="132.184" y="620.011">réduire les symptômes de la dépression et </tspan><tspan id="tspan7563" x="132.184" y="641.678">d&apos;augmenter les affects positifs subséquents.</tspan></text></g><text xml:space="preserve" id="text72692" x="317.596" y="-106.084" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:16px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans&quot;;white-space:pre;inline-size:304.781;fill:#fff;fill-opacity:1" transform="translate(158.359 186.076)"><tspan id="tspan7565" x="317.596" y="-106.084">Évaluer les comportements et le style
</tspan><tspan id="tspan7567" x="317.596" y="-86.084">de vie actuel du patient et relever les </tspan><tspan id="tspan7569" x="317.596" y="-66.084">perspectives d&apos;amélioration (hygiène, </tspan><tspan id="tspan7571" x="317.596" y="-46.084">alimentation, sommeil).
</tspan><tspan id="tspan7573" x="317.596" y="-26.084">
</tspan><tspan id="tspan7575" x="317.596" y="-6.084">Observer le degré d&apos;inactivité, identifier </tspan><tspan id="tspan7577" x="317.596" y="13.916">les comportements d&apos;évitement.
</tspan><tspan id="tspan7579" x="317.596" y="33.916">
</tspan><tspan id="tspan7581" x="317.596" y="53.916">Utiliser une grille d&apos;auto-observation des </tspan><tspan id="tspan7583" x="317.596" y="73.916">activités quotidiennes (heure par heure) </tspan><tspan id="tspan7585" x="317.596" y="93.916">à remplir sous forme de semainier.
</tspan><tspan id="tspan7587" x="317.596" y="113.916">
</tspan><tspan id="tspan7589" x="317.596" y="133.916">Réaliser l&apos;analyse fonctionnelle à partir </tspan><tspan id="tspan7591" x="317.596" y="153.916">de ces données.</tspan></text><text xml:space="preserve" id="text117098" x="589.114" y="35.291" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:18.6667px;line-height:1.25;font-family:&quot;Open Sans&quot;;-inkscape-font-specification:&quot;Open Sans Bold&quot;;fill:#fff;fill-opacity:1"><tspan id="tspan117096" x="589.114" y="35.291">PHASES</tspan></text></svg>